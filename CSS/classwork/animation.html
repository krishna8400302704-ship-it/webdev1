<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: red;
            animation-name: myAnimation;
            animation-duration: 4s;
            transform:skewX(60deg) ;
        }

        @keyframes myAnimation {
            from {
                background-color: red;
            }

            to {
                background-color: blue;
            }
        }
    </style>
</head>

<body>

    <h1>CSS Animation</h1>

    <div></div>

    <p font-size="100px"><b>Note:</b> When an animation is finished, it goes back to its original style.</p>

</body>

</html>
