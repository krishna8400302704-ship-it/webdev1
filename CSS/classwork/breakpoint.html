<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 400px;
            height: 400px;
            margin: 0;
            padding: 20px;
            background-color: red;
        }

        @media (max-width: 600px) {
            .container {
                height: 400px;
                width: 400px;
                background-color: rgb(0, 255, 72);
            }
        }

        @media (min-width: 600px) {
            .container {
                height: 600px;
                width: 600px;
                background-color: yellow;
            }
        }

        @media (min-width: 768px) {
            .container {
                height: 768px;
                width: 768px;
                background-color: blue;
            }
        }
    </style>
</head>

<body>
    <div class="container">

    </div>
</body>

</html>
