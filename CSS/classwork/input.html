<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>This is Input elements practice</h2>
    <form action="backend.php" method="post">
        <div>Name: <input type="text" name="myName"></div> <br>

        <div> Role: <input type="text" name="myRole"></div> <br>
        <div>Email: <input type="email" name="myEmail"></div><br>
        <div> <input type="submit" value="Submit" name="submit"> </div><br>

        <div>Datetime: <input type="datetime" name="date & time" id=""></div>

        <div>Date: <input type="date" name="Date" id=""></div>
        <div>Bonus: <input type="number" name="date" max="6"></div>
        <div>Checkbox:<input type="checkbox" name="multiple option"> Are you eligible</div>
        <div> Gender:Male<input type="radio" name="gender">Female<input type="radio" name="gender"></div>
        <fieldset>
            <legend>
                Personal Details (Text Inputs)
            </legend>
            <label for="fname">Full Name :</label>
            <input type="text" id="fname" name="Fname" placeholder="Enter Your full name"><br>

        </fieldset>
        <fieldset>
            <legend>
                Attendence
            </legend>
            <p>
                <label for="ticket">Ticket Type:</label>
                <select name="ticket" id="ticket">
                    <option name="ticket" value="student">Student (Free)
                    </option>
                    <option name="regular" value="general">General
                    </option>
                    <option name="vip" value="vip">VIP
                    </option>
                </select>
            </p>
            <label for="time">Estimated time : </label>
            <input type="time" name="time" id="time"><br>
            <label for="range">Comfort Range : </label>
            <input type="range" name="range" id="range" min="1" max="10" value="5"><br>

            <label for="color">T-shirt color : </label>
            <input type="color" name="color" id="color" value="blue"><br>
            <label for="link"> link : </label>
            <input type="link" name="link" id="link" value="https://example.com"><br>
            <label for="file"> file : </label>
            <input type="file" name="file" id="file"><br>

            <label for="text">Any special ?</label><br>
            <textarea name="text" id="text" rows="5" cols="50" placeholder="Enter your message"></textarea> 
        </fieldset> <br><br>
        <button type="submit">Submit Registration</button>
        <button type="reset" style="color: red; background:rgb(146, 146, 133);">Clear Form</button>



    </form>
</body>

</html>
