<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{position: absolute;
            left: 2px;
            top: 10px;
            z-index: -1;
}
    </style>
</head>
<body>
    <h1> This is heading </h1>
    <img src="tree.png">
    <p> Because the image has a z-index of -1, it will be placed behind the text.</p>
</body>
</html>
