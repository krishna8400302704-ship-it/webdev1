<style> 
   

 .photo-container{
    position: relative;
    display: inline block;
 }
 .photo-container img{
    width: 1450px;

 }
.name{

    background: yellow;
    color: black;
    padding:5px 10px;

}
.name1{
    top: 10%;
    left: 10%;
}

}
.name4{

.name5{

}
.name6{

}

    left: 90%;

    <!-- Full-screen background image -->

        <div class="name name2">Krishna</div>
