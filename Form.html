<body>
    <h2> HTML Forms </h2>

<form action="/action_page.php">

  <input type="text" id="fname" name="fname" value="krishna"><br>
  <!-- Label and Input for last name -->

  <input type="text" id="lname" name="lname" value="chaurasiya"><br><br>
   <!-- Button to submit the form -->

</form>
